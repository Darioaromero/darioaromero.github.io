<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#081508;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#dots)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="400" fill="#2ecc71"/>
  <!-- Decorative wind/diffusion lines (pollution dispersal) -->
  <path d="M 320 200 Q 380 170 440 200 Q 500 230 560 200" fill="none" stroke="#2ecc71" stroke-width="1.5" opacity="0.2"/>
  <path d="M 320 220 Q 380 190 440 220 Q 500 250 560 220" fill="none" stroke="#2ecc71" stroke-width="1.2" opacity="0.15"/>
  <path d="M 320 240 Q 380 210 440 240 Q 500 270 560 240" fill="none" stroke="#2ecc71" stroke-width="1" opacity="0.1"/>
  <path d="M 320 260 Q 380 230 440 260 Q 500 290 560 260" fill="none" stroke="#2ecc71" stroke-width="0.8" opacity="0.08"/>
  <!-- Bus route line -->
  <line x1="300" y1="310" x2="570" y2="310" stroke="#2ecc71" stroke-width="2" opacity="0.25"/>
  <circle cx="330" cy="310" r="5" fill="#2ecc71" opacity="0.3"/>
  <circle cx="390" cy="310" r="5" fill="#2ecc71" opacity="0.3"/>
  <circle cx="450" cy="310" r="5" fill="#2ecc71" opacity="0.3"/>
  <circle cx="510" cy="310" r="5" fill="#2ecc71" opacity="0.3"/>
  <!-- Diffusion circles from route -->
  <circle cx="390" cy="310" r="30" fill="none" stroke="#2ecc71" stroke-width="0.8" opacity="0.12"/>
  <circle cx="390" cy="310" r="55" fill="none" stroke="#2ecc71" stroke-width="0.6" opacity="0.08"/>
  <!-- Field label -->
  <text x="32" y="330" font-family="Georgia, serif" font-size="11" fill="#2ecc71" letter-spacing="3" opacity="0.9">ENVIRONMENTAL ECONOMICS</text>
  <!-- Divider -->
  <line x1="32" y1="342" x2="310" y2="342" stroke="#2ecc71" stroke-width="0.5" opacity="0.4"/>
  <!-- Subfield -->
  <text x="32" y="362" font-family="Georgia, serif" font-size="10" fill="#8899aa" letter-spacing="1.5">Colombia · Air Pollution · Education</text>
</svg>
