<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#081515;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#dots)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="400" fill="#1abc9c"/>
  <!-- Decorative bar chart (financial data) -->
  <rect x="340" y="220" width="28" height="100" fill="#1abc9c" opacity="0.15" rx="2"/>
  <rect x="380" y="160" width="28" height="160" fill="#1abc9c" opacity="0.15" rx="2"/>
  <rect x="420" y="190" width="28" height="130" fill="#1abc9c" opacity="0.15" rx="2"/>
  <rect x="460" y="140" width="28" height="180" fill="#1abc9c" opacity="0.2" rx="2"/>
  <rect x="500" y="170" width="28" height="150" fill="#1abc9c" opacity="0.15" rx="2"/>
  <!-- Trend line -->
  <polyline points="354,220 394,160 434,185 474,140 514,165" fill="none" stroke="#1abc9c" stroke-width="1.5" opacity="0.4"/>
  <!-- Node dots on trend line -->
  <circle cx="354" cy="220" r="3" fill="#1abc9c" opacity="0.5"/>
  <circle cx="394" cy="160" r="3" fill="#1abc9c" opacity="0.5"/>
  <circle cx="434" cy="185" r="3" fill="#1abc9c" opacity="0.5"/>
  <circle cx="474" cy="140" r="3" fill="#1abc9c" opacity="0.5"/>
  <circle cx="514" cy="165" r="3" fill="#1abc9c" opacity="0.5"/>
  <!-- Field label -->
  <text x="32" y="330" font-family="Georgia, serif" font-size="11" fill="#1abc9c" letter-spacing="3" opacity="0.9">MEDIA · FINANCE</text>
  <!-- Divider -->
  <line x1="32" y1="342" x2="220" y2="342" stroke="#1abc9c" stroke-width="0.5" opacity="0.4"/>
  <!-- Subfield -->
  <text x="32" y="362" font-family="Georgia, serif" font-size="10" fill="#8899aa" letter-spacing="1.5">United States · Trust · Household Finance</text>
</svg>
