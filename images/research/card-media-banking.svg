      <stop offset="0%" style="stop-color:#0d2020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#081515;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#1abc9c"/>
  <!-- Bar chart (right side) -->
  <rect x="750" y="160" width="36" height="110" fill="#1abc9c" opacity="0.12" rx="2"/>
  <rect x="800" y="110" width="36" height="160" fill="#1abc9c" opacity="0.12" rx="2"/>
  <rect x="850" y="130" width="36" height="140" fill="#1abc9c" opacity="0.12" rx="2"/>
  <rect x="900" y="90" width="36" height="180" fill="#1abc9c" opacity="0.16" rx="2"/>
  <rect x="950" y="115" width="36" height="155" fill="#1abc9c" opacity="0.12" rx="2"/>
  <rect x="1000" y="75" width="36" height="195" fill="#1abc9c" opacity="0.14" rx="2"/>
  <rect x="1050" y="100" width="36" height="170" fill="#1abc9c" opacity="0.12" rx="2"/>
  <rect x="1100" y="60" width="36" height="210" fill="#1abc9c" opacity="0.14" rx="2"/>
  <!-- Trend line -->
  <polyline points="768,160 818,110 868,128 918,90 968,112 1018,75 1068,98 1118,60" fill="none" stroke="#1abc9c" stroke-width="1.5" opacity="0.4"/>
  <circle cx="768" cy="160" r="3" fill="#1abc9c" opacity="0.5"/>
  <circle cx="918" cy="90" r="3" fill="#1abc9c" opacity="0.5"/>
  <circle cx="1018" cy="75" r="3" fill="#1abc9c" opacity="0.5"/>
  <circle cx="1118" cy="60" r="3" fill="#1abc9c" opacity="0.5"/>
  <!-- Field label -->
  <text x="60" y="220" font-family="Georgia, serif" font-size="12" fill="#1abc9c" letter-spacing="4" opacity="0.9">MEDIA · FINANCE</text>
  <line x1="60" y1="234" x2="280" y2="234" stroke="#1abc9c" stroke-width="0.5" opacity="0.4"/>
  <text x="60" y="256" font-family="Georgia, serif" font-size="11" fill="#8899aa" letter-spacing="2">United States · Trust · Household Finance</text>
