<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1520;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#dots)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="400" fill="#e74c3c"/>
  <!-- Decorative circles (abstract map nodes) -->
  <circle cx="420" cy="100" r="60" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.2"/>
  <circle cx="420" cy="100" r="40" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.15"/>
  <circle cx="420" cy="100" r="20" fill="#e74c3c" opacity="0.12"/>
  <line x1="360" y1="150" x2="480" y2="280" stroke="#e74c3c" stroke-width="1" opacity="0.1"/>
  <line x1="390" y1="80" x2="500" y2="320" stroke="#e74c3c" stroke-width="1" opacity="0.08"/>
  <circle cx="480" cy="280" r="8" fill="#e74c3c" opacity="0.2"/>
  <circle cx="500" cy="200" r="5" fill="#e74c3c" opacity="0.15"/>
  <!-- Field label -->
  <text x="32" y="330" font-family="Georgia, serif" font-size="11" fill="#e74c3c" letter-spacing="3" opacity="0.9">POLITICAL ECONOMY</text>
  <!-- Divider -->
  <line x1="32" y1="342" x2="280" y2="342" stroke="#e74c3c" stroke-width="0.5" opacity="0.4"/>
  <!-- Subfield -->
  <text x="32" y="362" font-family="Georgia, serif" font-size="10" fill="#8899aa" letter-spacing="1.5">Latin America · Institutions · Foreign Policy</text>
</svg>
