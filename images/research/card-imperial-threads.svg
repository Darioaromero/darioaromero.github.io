<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#dots)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="400" fill="#d4a017"/>
  <!-- Decorative weave pattern (thread/textile) -->
  <path d="M 350 60 Q 420 100 350 140 Q 280 180 350 220 Q 420 260 350 300 Q 280 340 350 380" fill="none" stroke="#d4a017" stroke-width="1.5" opacity="0.25"/>
  <path d="M 400 60 Q 470 100 400 140 Q 330 180 400 220 Q 470 260 400 300 Q 330 340 400 380" fill="none" stroke="#d4a017" stroke-width="1.5" opacity="0.18"/>
  <path d="M 450 60 Q 520 100 450 140 Q 380 180 450 220 Q 520 260 450 300 Q 380 340 450 380" fill="none" stroke="#d4a017" stroke-width="1.5" opacity="0.12"/>
  <path d="M 500 80 Q 570 120 500 160 Q 430 200 500 240 Q 570 280 500 320" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.1"/>
  <!-- Field label -->
  <text x="32" y="330" font-family="Georgia, serif" font-size="11" fill="#d4a017" letter-spacing="3" opacity="0.9">ECONOMIC HISTORY</text>
  <!-- Divider -->
  <line x1="32" y1="342" x2="260" y2="342" stroke="#d4a017" stroke-width="0.5" opacity="0.4"/>
  <!-- Subfield -->
  <text x="32" y="362" font-family="Georgia, serif" font-size="10" fill="#8899aa" letter-spacing="1.5">Spain · Innovation · Trade Policy</text>
</svg>
