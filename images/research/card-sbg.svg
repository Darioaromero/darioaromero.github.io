<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#08121e;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#3498db"/>
  <!-- Broadcast / signal rings (right side) -->
  <circle cx="1000" cy="130" r="25" fill="none" stroke="#3498db" stroke-width="1.5" opacity="0.3"/>
  <circle cx="1000" cy="130" r="55" fill="none" stroke="#3498db" stroke-width="1" opacity="0.2"/>
  <circle cx="1000" cy="130" r="85" fill="none" stroke="#3498db" stroke-width="1" opacity="0.14"/>
  <circle cx="1000" cy="130" r="120" fill="none" stroke="#3498db" stroke-width="0.8" opacity="0.09"/>
  <circle cx="1000" cy="130" r="155" fill="none" stroke="#3498db" stroke-width="0.6" opacity="0.06"/>
  <circle cx="1000" cy="130" r="10" fill="#3498db" opacity="0.35"/>
  <!-- Network spokes -->
  <line x1="1000" y1="130" x2="860" y2="220" stroke="#3498db" stroke-width="0.8" opacity="0.12"/>
  <line x1="1000" y1="130" x2="820" y2="100" stroke="#3498db" stroke-width="0.8" opacity="0.12"/>
  <line x1="1000" y1="130" x2="850" y2="50" stroke="#3498db" stroke-width="0.8" opacity="0.1"/>
  <circle cx="860" cy="220" r="4" fill="#3498db" opacity="0.25"/>
  <circle cx="820" cy="100" r="4" fill="#3498db" opacity="0.25"/>
  <circle cx="850" cy="50" r="4" fill="#3498db" opacity="0.2"/>
  <!-- Field label -->
  <text x="60" y="220" font-family="Georgia, serif" font-size="12" fill="#3498db" letter-spacing="4" opacity="0.9">POLITICAL ECONOMY · MEDIA</text>
  <line x1="60" y1="234" x2="390" y2="234" stroke="#3498db" stroke-width="0.5" opacity="0.4"/>
  <text x="60" y="256" font-family="Georgia, serif" font-size="11" fill="#8899aa" letter-spacing="2">United States · Elections · Media Bias</text>
</svg>
