<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#08121e;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#dots)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="400" fill="#3498db"/>
  <!-- Decorative broadcast waves (signal emanating from point) -->
  <circle cx="470" cy="160" r="20" fill="none" stroke="#3498db" stroke-width="1.5" opacity="0.3"/>
  <circle cx="470" cy="160" r="45" fill="none" stroke="#3498db" stroke-width="1" opacity="0.2"/>
  <circle cx="470" cy="160" r="70" fill="none" stroke="#3498db" stroke-width="1" opacity="0.15"/>
  <circle cx="470" cy="160" r="100" fill="none" stroke="#3498db" stroke-width="0.8" opacity="0.1"/>
  <circle cx="470" cy="160" r="130" fill="none" stroke="#3498db" stroke-width="0.8" opacity="0.07"/>
  <circle cx="470" cy="160" r="8" fill="#3498db" opacity="0.4"/>
  <!-- network lines -->
  <line x1="470" y1="160" x2="360" y2="240" stroke="#3498db" stroke-width="0.8" opacity="0.12"/>
  <line x1="470" y1="160" x2="320" y2="180" stroke="#3498db" stroke-width="0.8" opacity="0.12"/>
  <circle cx="360" cy="240" r="4" fill="#3498db" opacity="0.25"/>
  <circle cx="320" cy="180" r="4" fill="#3498db" opacity="0.25"/>
  <!-- Field label -->
  <text x="32" y="330" font-family="Georgia, serif" font-size="11" fill="#3498db" letter-spacing="3" opacity="0.9">POLITICAL ECONOMY · MEDIA</text>
  <!-- Divider -->
  <line x1="32" y1="342" x2="310" y2="342" stroke="#3498db" stroke-width="0.5" opacity="0.4"/>
  <!-- Subfield -->
  <text x="32" y="362" font-family="Georgia, serif" font-size="10" fill="#8899aa" letter-spacing="1.5">United States · Elections · Media Bias</text>
</svg>
